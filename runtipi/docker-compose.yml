# notifications: the main service is a small MCP front (mcp/front.py + mcp/tools.py, inlined by mcp/inline.py).
# It serves the Notifications tools at /mcp (box-only: apps on this box, e.g. the agent through the Wizard hub)
# and passes every other request unchanged to notifications-engine, the unmodified ntfy server, so the ntfy web
# app and the ntfy phone apps work exactly as upstream.
services:
  notifications:
    image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
    # Rootless Docker boxes whose agent folders are owner-only (0700) set NOTIFICATIONS_USER=0:0 (container root
    # is the box owner there, with no capabilities).
    user: ${NOTIFICATIONS_USER:-1000:1000}
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 256
    mem_limit: 128m
    environment:
      WIZARD_APP: notifications
      APP_VERSION: 2.29.0-wizard27
      FRONT_PORT: '8080'
      UPSTREAM_HOST: notifications-engine
      UPSTREAM_PORT: '8080'
      NOTIFY_TOPIC: ${NOTIFY_TOPIC:-wizard}
      PYTHONDONTWRITEBYTECODE: '1'
      # Inbox: agent notes (wizard) and scheduled-job results (cron); read/flag/archive marks live in /data.
      INBOX_TOPICS: ${NOTIFY_TOPIC:-wizard},cron
      INBOX_STATE: /data/inbox.json
      # Phone notifications (the Wizard OS Android app's own connection, no Google push): only this Tailscale
      # login may read them when set; empty = any signed-in tailnet user, never another app on the box.
      PHONE_OWNER_LOGIN: ${PHONE_OWNER_LOGIN:-}
      # Scheduled-job relay: the agent's Hermes cron folder, read-only. Empty folder = relay idle.
      CRON_DIR: /hermes-cron
      CRON_QUIET_JOBS: ${CRON_QUIET_JOBS:-}
      # job=app pairs: those jobs' results are listed under that app (tag app:<id>) instead of the agent's own.
      CRON_JOB_APPS: ${CRON_JOB_APPS:-}
      CRON_RELAY: ${CRON_RELAY:-on}
      # Failures go to the agent's 'Failure responder' cron job when one exists (auto); owner = always post.
      CRON_FAILURES: ${CRON_FAILURES:-auto}
      CRON_ESCALATE_H: ${CRON_ESCALATE_H:-24}
      # Thumbnails: up to four host folders whose images notifications may show (MEDIA:<path> lines), each
      # mounted read-only at its own path. Unset = none.
      INBOX_MEDIA_ROOTS: ${INBOX_MEDIA_1:-}:${INBOX_MEDIA_2:-}:${INBOX_MEDIA_3:-}:${INBOX_MEDIA_4:-}
    volumes:
    - ${APP_DATA_DIR}/inbox:/data
    - ${HERMES_CRON_DIR:-${APP_DATA_DIR}/no-hermes-cron}:/hermes-cron:ro
    - ${INBOX_MEDIA_1:-${APP_DATA_DIR}/no-media-1}:${INBOX_MEDIA_1:-/no-media-1}:ro
    - ${INBOX_MEDIA_2:-${APP_DATA_DIR}/no-media-2}:${INBOX_MEDIA_2:-/no-media-2}:ro
    - ${INBOX_MEDIA_3:-${APP_DATA_DIR}/no-media-3}:${INBOX_MEDIA_3:-/no-media-3}:ro
    - ${INBOX_MEDIA_4:-${APP_DATA_DIR}/no-media-4}:${INBOX_MEDIA_4:-/no-media-4}:ro
    depends_on:
    - notifications-engine
    command:
    - python
    - -c
    # BEGIN MCP FRONT (generated by mcp/inline.py)
    - |
      """Wizard MCP front: serves this app's MCP tools at /mcp and passes every other request,
      byte for byte, to the app behind it (HTTP, streaming and WebSockets alike).
      Stdlib only, so it runs on a stock python image with no build step.
      Generated from the app repo's mcp/ folder; edit there, then run mcp/inline.py."""
      import asyncio
      import contextvars
      import base64
      import json
      import os
      import socket
      import struct
      import time
      import urllib.parse
      import urllib.request
      import uuid

      APP = os.environ.get("WIZARD_APP", "app")
      VERSION = os.environ.get("APP_VERSION", "0")
      PORT = int(os.environ.get("FRONT_PORT", "8080"))
      UP_HOST = os.environ.get("UPSTREAM_HOST", "")
      UP_PORT = int(os.environ.get("UPSTREAM_PORT", str(PORT)))
      MCP_PATH = "/mcp"
      MCP_TOKEN = os.environ.get("MCP_TOKEN", "")  # when set, /mcp needs Authorization: Bearer <token>
      MAX_HEAD = 65536
      MAX_BODY = 1 << 20
      TOOLS = {}
      ROUTES = {}  # path prefix -> fn(method, path, query, headers, body) -> (status, content_type, bytes); app pages and APIs
      STREAMS = {}  # exact path -> async fn(reader, writer, method, target, rest): a response that stays open (event streams)
      REQUEST = contextvars.ContextVar("request", default={})  # headers of the current /mcp call


      def tool(name, description, props=None, required=()):
          def deco(fn):
              schema = {"type": "object", "properties": props or {}, "required": list(required)}
              TOOLS[name] = ({"name": name, "description": description, "inputSchema": schema}, fn)
              return fn
          return deco


      def route(prefix):
          def deco(fn):
              ROUTES[prefix] = fn
              return fn
          return deco


      def stream(path):
          def deco(fn):
              STREAMS[path] = fn
              return fn
          return deco


      async def serve_route(reader, writer, fn, method, target, rest):
          headers = {}
          for line in rest.decode("latin-1").split("\r\n"):
              if ":" in line:
                  k, v = line.split(":", 1)
                  headers[k.strip().lower()] = v.strip()
          # The caller's address, under a key no request header can produce (header names never start with ':').
          headers[":peer"] = (writer.get_extra_info("peername") or ("",))[0]
          n = int(headers.get("content-length") or 0)
          if n > MAX_BODY:
              return await respond(writer, 413, {"error": "request too large"})
          body = await reader.readexactly(n) if n else b""
          path, _, query = target.partition("?")
          try:
              code, ctype, data = await asyncio.to_thread(fn, method, path, query, headers, body)
          except Exception as e:  # an app route error is a 500 for that request only
              code, ctype, data = 500, "application/json", json.dumps({"error": "%s: %s" % (type(e).__name__, e)}).encode()
          head = "HTTP/1.1 %d %s\r\nContent-Type: %s\r\nContent-Length: %d\r\nCache-Control: no-store\r\nX-Content-Type-Options: nosniff\r\nConnection: close\r\n\r\n" % (
              code, REASONS.get(code, "OK"), ctype, len(data))
          writer.write(head.encode() + data)
          try:
              await writer.drain()
          finally:
              writer.close()


      def up_addr():
          try:
              return socket.gethostbyname(UP_HOST)
          except OSError:
              return UP_HOST


      def http(method, path, body=None, headers=None, timeout=60):
          url = "http://%s:%d%s" % (up_addr(), UP_PORT, path)
          req = urllib.request.Request(url, data=body, method=method, headers=headers or {})
          with urllib.request.urlopen(req, timeout=timeout) as r:
              return r.status, r.read()


      def err(i, code, message):
          return {"jsonrpc": "2.0", "id": i, "error": {"code": code, "message": message}}


      def rpc(msg):
          m, i, p = msg.get("method"), msg.get("id"), msg.get("params") or {}
          if m == "initialize":
              r = {"protocolVersion": p.get("protocolVersion", "2025-06-18"), "capabilities": {"tools": {}},
                   "serverInfo": {"name": APP, "version": VERSION}}
          elif m == "tools/list":
              r = {"tools": [t[0] for t in TOOLS.values()]}
          elif m == "tools/call":
              name, args = p.get("name"), p.get("arguments") or {}
              if name not in TOOLS:
                  return err(i, -32602, "unknown tool %s" % name)
              try:
                  out = TOOLS[name][1](**args)
                  if isinstance(out, dict) and "_content" in out:
                      r = {"content": out["_content"]}
                  else:
                      text = out if isinstance(out, str) else json.dumps(out, indent=2)
                      r = {"content": [{"type": "text", "text": text[:200000]}]}
              except Exception as e:  # tool errors go back to the agent, not the transport
                  r = {"content": [{"type": "text", "text": "%s: %s" % (type(e).__name__, e)}], "isError": True}
          elif m == "ping":
              r = {}
          elif i is None:
              return None  # notification
          else:
              return err(i, -32601, "unknown method %s" % m)
          return {"jsonrpc": "2.0", "id": i, "result": r}


      REASONS = {200: "OK", 202: "Accepted", 400: "Bad Request", 404: "Not Found", 405: "Method Not Allowed",
                 401: "Unauthorized", 403: "Forbidden", 415: "Unsupported Media Type", 500: "Internal Server Error", 413: "Payload Too Large", 502: "Bad Gateway"}


      async def respond(writer, code, obj=None, extra=""):
          body = b"" if obj is None else json.dumps(obj).encode()
          head = "HTTP/1.1 %d %s\r\nContent-Type: application/json\r\nContent-Length: %d\r\nConnection: close\r\n%s\r\n" % (
              code, REASONS.get(code, "OK"), len(body), extra)
          writer.write(head.encode() + body)
          try:
              await writer.drain()
          finally:
              writer.close()


      def parse_headers(rest):
          headers = {}
          for line in rest.decode("latin-1").split("\r\n"):
              if ":" in line:
                  k, v = line.split(":", 1)
                  headers[k.strip().lower()] = v.strip()
          return headers


      def networked(headers):
          """The request came through Tailscale Serve, a tunnel or a proxy (not from an app on this box)."""
          return any(k.startswith(("tailscale-", "x-forwarded-", "cf-")) or k in ("forwarded", "x-real-ip") for k in headers)


      GET_PUBLISH = ("/publish", "/send", "/trigger")  # ntfy also publishes on GET /<topic>/publish?message=...


      def cross_site(method, path, headers):
          """A browser request made by a page on another origin: another website, or another app's port on this box.
          ntfy answers every request with Access-Control-Allow-Origin: * (its built-in default, not configurable in
          v2.29) and has no login here, so such a page could read and publish the owner's notifications. The ntfy web
          app (same origin) and the ntfy phone apps (no browser headers) are unaffected; a link that opens the web app
          in a tab is a top-level visit and still works."""
          host = headers.get("host", "").lower()
          origin = headers.get("origin")
          if origin is not None and (origin == "null" or urllib.parse.urlsplit(origin).netloc.lower() != host):
              return True
          publish = method in ("GET", "HEAD") and path.rstrip("/").endswith(GET_PUBLISH) and path.rstrip("/").count("/") == 2
          if headers.get("sec-fetch-site", "") in ("cross-site", "same-site"):
              visit = (method in ("GET", "HEAD") and headers.get("sec-fetch-mode") == "navigate"
                       and headers.get("sec-fetch-dest") == "document")
              if not visit or publish:
                  return True
          # Browsers without Fetch Metadata still send the linking page as Referer on an <img>/<script> GET.
          ref = headers.get("referer")
          return bool(publish and ref and urllib.parse.urlsplit(ref).netloc.lower() != host)


      async def mcp(reader, writer, method, rest):
          headers = parse_headers(rest)
          if MCP_TOKEN:
              import hmac
              if not hmac.compare_digest(headers.get("authorization", "").encode(), ("Bearer " + MCP_TOKEN).encode()):
                  return await respond(writer, 401, {"error": "this MCP needs Authorization: Bearer <token>"}, 'WWW-Authenticate: Bearer\r\n')
          elif networked(headers):
              # Without a token the MCP is for apps on this box only, the handshake (initialize, tools/list) included,
              # like every tool already is (_box_only).
              return await respond(writer, 403, {"error": "this MCP is only for apps on this box"})
          if method != "POST":
              return await respond(writer, 405, {"error": "use POST %s" % MCP_PATH}, "Allow: POST\r\n")
          n = int(headers.get("content-length") or 0)
          if n > MAX_BODY:
              return await respond(writer, 413, {"error": "request too large"})
          body = await reader.readexactly(n) if n else b""
          try:
              msg = json.loads(body or b"{}")
          except ValueError:
              return await respond(writer, 400, err(None, -32700, "parse error"))
          REQUEST.set(headers)
          batch = msg if isinstance(msg, list) else [msg]
          results = await asyncio.gather(*(asyncio.to_thread(rpc, x) for x in batch if isinstance(x, dict)))
          out = [x for x in results if x]
          if not out:
              return await respond(writer, 202)
          await respond(writer, 200, out if isinstance(msg, list) else out[0])


      async def pipe(r, w):
          try:
              while True:
                  data = await r.read(65536)
                  if not data:
                      break
                  w.write(data)
                  await w.drain()
          except (ConnectionError, OSError):
              pass
          finally:
              try:
                  w.close()
              except Exception:
                  pass


      async def handle(reader, writer):
          try:
              head = await reader.readuntil(b"\r\n\r\n")
          except (asyncio.IncompleteReadError, asyncio.LimitOverrunError, ConnectionError):
              writer.close()
              return
          line, _, rest = head.partition(b"\r\n")
          parts = line.decode("latin-1").split(" ")
          path = parts[1].split("?", 1)[0] if len(parts) >= 3 else ""
          if path in STREAMS:
              return await STREAMS[path](reader, writer, parts[0], parts[1], rest)
          for prefix, fn in sorted(ROUTES.items(), key=lambda r: -len(r[0])):   # the most specific prefix wins
              if path == prefix.rstrip("/") or path.startswith(prefix):
                  return await serve_route(reader, writer, fn, parts[0], parts[1], rest)
          if cross_site(parts[0], path, parse_headers(rest)):
              # No Access-Control-* header: the page that sent it can neither read the answer nor pass a preflight.
              return await respond(writer, 403, {"error": "cross-site requests are refused"})
          if path == MCP_PATH:
              return await mcp(reader, writer, parts[0], rest)
          if not UP_HOST:
              return await respond(writer, 404, {"error": "not found"})
          try:
              ur, uw = await asyncio.open_connection(UP_HOST, UP_PORT)
          except OSError:
              return await respond(writer, 502, {"error": "%s is starting or not reachable" % APP})
          # One request per proxied connection (unless it is an upgrade such as a WebSocket), so a
          # later /mcp request can never ride an upstream keep-alive connection.
          lines = head.decode("latin-1").split("\r\n")
          if not any(l.lower().startswith("upgrade:") for l in lines):
              lines = [l for l in lines if l and not l.lower().startswith(("connection:", "keep-alive:"))]
              head = ("\r\n".join(lines) + "\r\nConnection: close\r\n\r\n").encode("latin-1")
          uw.write(head)
          await uw.drain()
          await asyncio.gather(pipe(reader, uw), pipe(ur, writer))


      async def main():
          srv = await asyncio.start_server(handle, "0.0.0.0", PORT, limit=MAX_HEAD)
          async with srv:
              await srv.serve_forever()


      # ---- tools for this app ----
      # Notifications tools: the agent sends the owner a notification and reads recent ones.
      # Everything goes to one topic on the box's own ntfy server (the engine behind this front), which the owner
      # subscribes to once in the ntfy phone app or the web app. Nothing leaves the box unless the owner points
      # their phone at it.

      TOPIC = os.environ.get("NOTIFY_TOPIC", "wizard")
      # A notification about one app carries the tag `app:<app id>`: the inbox files it under that app (its name, mark and
      # Chats / Badge / Off choice) instead of the agent's own group. Untagged = the agent's own.
      import re as _re
      APP_TAG = "app:"
      APP_ID_RX = _re.compile(r"[a-z0-9][a-z0-9-]{0,63}")


      def item_app(tags):
          """The app a notification is about (its `app:<id>` tag), or ''."""
          for t in tags or []:
              t = str(t)
              if t.startswith(APP_TAG) and APP_ID_RX.fullmatch(t[len(APP_TAG):]):
                  return t[len(APP_TAG):]
          return ""
      PRIORITIES = {"min": 1, "low": 2, "default": 3, "high": 4, "urgent": 5}


      def _box_only():
          """Only apps on this box (e.g. the agent through the Wizard hub) can use these tools, never a request that
          came in through Tailscale Serve, a tunnel or a proxy."""
          h = REQUEST.get()
          if any(h.get(k) for k in ("tailscale-user-login", "x-forwarded-for", "forwarded", "cf-connecting-ip",
                                    "cf-access-jwt-assertion", "x-real-ip")):
              raise PermissionError("the Notifications tools are only for apps on this box")


      def _clean(text, limit):
          text = " ".join(str(text or "").split()) if limit <= 250 else str(text or "").strip()
          return text[:limit]


      @tool("notify", "Send the owner a notification on their phone and in the Notifications app. Use it for things "
            "they asked to be told about, finished long jobs, or problems that need them. Keep it short and plain.",
            {"message": {"type": "string", "description": "What happened, in one or two sentences"},
             "title": {"type": "string", "description": "Short title, e.g. 'Video ready' (optional)"},
             "priority": {"type": "string", "enum": list(PRIORITIES), "description": "default unless it is urgent"},
             "link": {"type": "string", "description": "https link to open when tapped (optional)"},
             "tags": {"type": "string", "description": "Comma-separated emoji short codes, e.g. 'white_check_mark' (optional)"},
             "app": {"type": "string", "description": "Id of the installed app this is about, e.g. 'sniper' (optional): it is "
                     "then listed under that app and follows that app's notification choice; leave empty for your own"}},
            ["message"])
      def notify(message, title="", priority="default", link="", tags="", app=""):
          _box_only()
          body = _clean(message, 4000)
          if not body:
              raise ValueError("say what to tell the owner")
          payload = {"topic": TOPIC, "message": body, "priority": PRIORITIES.get(str(priority or "default"), 3)}
          if title:
              payload["title"] = _clean(title, 250)
          if link:
              url = str(link).strip()
              if not url.startswith("https://") or any(c.isspace() for c in url):
                  raise ValueError("link must be an https:// address")
              payload["click"] = url[:2000]
          if tags:
              payload["tags"] = [t for t in (_clean(x, 40) for x in str(tags).split(",")) if t and not t.startswith(APP_TAG)][:5]
          app = str(app or "").strip().lower()
          if app:
              if not APP_ID_RX.fullmatch(app):
                  raise ValueError("app is an app id like 'sniper'")
              payload["tags"] = payload.get("tags", []) + [APP_TAG + app]
          status, raw = http("POST", "/", json.dumps(payload).encode(), {"Content-Type": "application/json"}, timeout=20)
          sent = json.loads(raw or b"{}")
          return {"sent": True, "id": sent.get("id"), "topic": TOPIC, "time": sent.get("time")}


      @tool("notifications_recent", "Read the notifications sent to the owner recently, newest last.",
            {"since": {"type": "string", "description": "How far back: e.g. '30m', '12h', '2d' (default 24h)"},
             "limit": {"type": "integer", "description": "Max notifications, default 20, up to 100"}})
      def notifications_recent(since="24h", limit=20):
          _box_only()
          window = str(since or "24h").strip()
          if not window or len(window) > 6 or not window[:-1].isdigit() or window[-1] not in "smhd":
              raise ValueError("since looks like 30m, 12h or 2d")
          cap = max(1, min(int(limit or 20), 100))
          status, raw = http("GET", "/%s/json?poll=1&since=%s" % (urllib.parse.quote(TOPIC), window), timeout=20)
          items = []
          for line in raw.decode("utf-8", "replace").splitlines():
              try:
                  m = json.loads(line)
              except ValueError:
                  continue
              if m.get("event") != "message":
                  continue
              items.append({"time": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(m.get("time", 0))),
                            "title": m.get("title", ""), "message": m.get("message", ""),
                            "priority": m.get("priority", 3), "link": m.get("click", "")})
          return {"topic": TOPIC, "since": window, "count": len(items), "notifications": items[-cap:]}


      # ---- Inbox: the owner's view of everything sent here, with read / flag / archive ----
      # The page and its API live on this front at /notifications/ (the Wizard shell opens it at the same path on its own
      # origin). ntfy keeps the messages (30 days); this keeps only the owner's marks, in a small JSON file.
      import tempfile
      import threading

      INBOX = "/notifications/"
      STATE_FILE = os.environ.get("INBOX_STATE", "/data/inbox.json")
      TOPICS = [t for t in os.environ.get("INBOX_TOPICS", TOPIC).split(",") if t.strip()]
      _lock = threading.Lock()


      def _load_state():
          try:
              with open(STATE_FILE) as f:
                  d = json.load(f)
              return d if isinstance(d, dict) else {}
          except (OSError, ValueError):
              return {}


      def _save_state(d):
          tmp = STATE_FILE + ".tmp"
          with open(tmp, "w") as f:
              json.dump(d, f)
          os.replace(tmp, STATE_FILE)


      def _messages(since="all"):
          out = []
          for t in TOPICS:
              status, raw = http("GET", "/%s/json?poll=1&since=%s" % (urllib.parse.quote(t.strip()), since), timeout=20)
              for line in raw.decode("utf-8", "replace").splitlines():
                  try:
                      m = json.loads(line)
                  except ValueError:
                      continue
                  if m.get("event") == "message":
                      out.append(m)
                  elif m.get("error") or m.get("http"):
                      # ntfy can stop a poll part-way with HTTP 200 and an error line (e.g. its daily bandwidth limit).
                      # A cut-off list is not the inbox: fail loudly instead of returning half of it.
                      raise RuntimeError("ntfy stopped the %s list part-way: %s" % (t.strip(), m.get("error") or m.get("http")))
          out.sort(key=lambda m: m.get("time", 0), reverse=True)
          return out


      def inbox_items(view="inbox", limit=200):
          st = _load_state()
          items = []
          for m in _messages():
              s = st.get(m["id"], {})
              tags = m.get("tags") or []
              it = {"id": m["id"], "time": m.get("time", 0), "title": m.get("title", ""), "message": m.get("message", ""),
                    "priority": m.get("priority", 3), "link": m.get("click", ""), "tags": tags,
                    "source": "cron" if "cron" in tags else "agent",
                    **({"from": item_app(tags)} if item_app(tags) else {}),
                    "read": bool(s.get("read")), "flag": bool(s.get("flag")), "archived": bool(s.get("archived"))}
              items.append(it)
          counts = {"unread": sum(1 for i in items if not i["read"] and not i["archived"]),
                    "needs": sum(1 for i in items if not i["read"] and not i["archived"] and i["priority"] >= 4),
                    "flagged": sum(1 for i in items if i["flag"] and not i["archived"])}
          if view == "flagged":
              items = [i for i in items if i["flag"] and not i["archived"]]
          elif view == "archive":
              items = [i for i in items if i["archived"]]
          elif view == "all":
              pass
          else:
              items = [i for i in items if not i["archived"]]
          return {"view": view, "counts": counts, "items": items[:max(1, min(int(limit or 200), 500))]}


      APP_ID = "a-"          # app inbox feed items (Wizard OS inbox feed v1): "a-<app id>-<key hash>", kept by the shell
      APP_KEEP = 60 * 86400   # an app item's mark outlives ntfy's 30 days; dropped 60 days after the activity it covers


      def _app_id(i):
          return isinstance(i, str) and i.startswith(APP_ID) and 3 < len(i) <= 128 and all(c.isalnum() or c in "-_" for c in i)


      MARK_GONE_GRACE = 3 * 86400   # a notification mark is forgotten only after ntfy has stopped listing it for 3 days


      def _prune_marks(st, now):
          """Forget marks for messages ntfy has expired. Never on a partial or failed read: one bad poll must not wipe
          the owner's read/archived state (that brought weeks of old items back as unread)."""
          try:
              live = {m["id"] for m in _messages()}
          except Exception:
              return st
          out = {}
          for k, v in st.items():
              if _app_id(k):
                  if now - float(v.get("at") or 0) < APP_KEEP:
                      out[k] = v
              elif k in live:
                  v.pop("gone", None)
                  out[k] = v
              else:
                  try:
                      gone = float(v.get("gone") or now)
                  except (TypeError, ValueError):
                      gone = now
                  if now - gone < MARK_GONE_GRACE:
                      v["gone"] = gone
                      out[k] = v
          return out


      def inbox_mark(ids, at=None, **marks):
          ids = [str(i)[:128] if _app_id(str(i)) else str(i)[:40] for i in (ids or [])][:500]
          keep = {k: bool(v) for k, v in marks.items() if k in ("read", "flag", "archived") and v is not None}
          if not ids or not keep:
              raise ValueError("give ids and at least one of read, flag, archived")
          at = at if isinstance(at, dict) else {}
          now = time.time()
          with _lock:
              st = _load_state()
              for i in ids:
                  cur = st.get(i, {})
                  cur.update(keep)
                  if keep.get("archived"):
                      cur["read"] = True
                  if _app_id(i):
                      # The mark covers the item as it was (its latest activity): newer activity in the app brings it back.
                      try:
                          cur["at"] = max(0, min(float(at.get(i, now)), now + 60))
                      except (TypeError, ValueError):
                          cur["at"] = now
                  st[i] = cur
              st = _prune_marks(st, now)
              _save_state(st)
          return {"ok": True, "changed": len(ids)}


      def app_marks():
          st = _load_state()
          return {"marks": {k: {"read": bool(v.get("read")), "archived": bool(v.get("archived")), "at": float(v.get("at") or 0)}
                            for k, v in st.items() if _app_id(k)}}


      # ---- Inbox sources: per app, whether its "needs you" items show in the Chats inbox (and, later, on the phone) ----
      # One small JSON file beside the marks (never inside inbox.json: marks pruning would drop it). An app that is not
      # listed shows in Chats (chats: true). "phone" is reserved for phone notifications; nothing reads it yet.
      SOURCES_FILE = os.environ.get("INBOX_SOURCES", os.path.join(os.path.dirname(STATE_FILE) or ".", "sources.json"))
      SOURCES_MAX_APPS = 200
      SOURCES_MAX_BODY = 4096
      _SOURCE_FLAGS = ("chats", "phone")


      def _source_app(a):
          return isinstance(a, str) and 0 < len(a) <= 64 and a[0].isalnum() and all(c.islower() or c.isdigit() or c == "-" for c in a)


      def _clean_sources(d):
          out = {}
          if isinstance(d, dict):
              for app, v in d.items():
                  if _source_app(app) and isinstance(v, dict):
                      out[app] = {k: bool(v.get(k, True)) for k in _SOURCE_FLAGS}
                  if len(out) >= SOURCES_MAX_APPS:
                      break
          return out


      def inbox_sources():
          try:
              with open(SOURCES_FILE) as f:
                  d = json.load(f)
          except (OSError, ValueError):
              d = {}
          return {"sources": _clean_sources(d.get("sources") if isinstance(d, dict) else None)}


      def set_inbox_source(app, chats=None, phone=None):
          if not _source_app(app):
              raise ValueError("give an app id")
          patch = {k: v for k, v in (("chats", chats), ("phone", phone)) if v is not None}
          if not patch or any(not isinstance(v, bool) for v in patch.values()):
              raise ValueError("give chats and/or phone as true or false")
          with _lock:
              cur = inbox_sources()["sources"]
              if app not in cur and len(cur) >= SOURCES_MAX_APPS:
                  raise ValueError("too many apps")
              cur[app] = {**{k: True for k in _SOURCE_FLAGS}, **cur.get(app, {}), **patch}
              # Atomic: a temp file in the same folder, flushed to disk, then renamed over the old one.
              folder = os.path.dirname(SOURCES_FILE) or "."
              fd, tmp = tempfile.mkstemp(prefix=".sources-", suffix=".tmp", dir=folder)
              try:
                  with os.fdopen(fd, "w") as f:
                      json.dump({"sources": cur}, f)
                      f.flush()
                      os.fsync(f.fileno())
                  os.chmod(tmp, 0o666)
                  os.replace(tmp, SOURCES_FILE)
              except BaseException:
                  try:
                      os.unlink(tmp)
                  except OSError:
                      pass
                  raise
          return {"ok": True, "sources": cur}


      # ---- Routes: where each source's notifications go, ONE place each (Miguel, 2 Nov 2026) ----
      # Chats (a thread that waits), Badge (a count on its icon), Morning report ("daily": one line in tomorrow's report) or Off (only
      # this app's history). Stored on the box, so every device shows the same choice. Sources: an app id, "notifications"
      # (the agent's own alerts) or "system:<kind>" for notices about Wizard itself. Daily is for System only: an app's own
      # items (Mail, Messenger) would lose their point if they waited a day. The agent's own alerts (about no app) only ever
      # wait in Chats (Miguel, 5 Nov 2026): no Badge, Daily or Off, so the owner fixes their cause or gives the noise an app.
      ROUTES_FILE = os.environ.get("INBOX_ROUTES", os.path.join(os.path.dirname(STATE_FILE) or ".", "routes.json"))
      ROUTE_TO = ("chats", "badge", "daily", "off")
      SYSTEM_KINDS = {
          "app-updates": ("App updates", r"(\d+ apps? updated|App updates need a look)"),
          "connections": ("App connections", r"(App connection added|Connection needs your OK)"),
          "wizard-updates": ("Wizard updates", r"(App Manager updated|Wizard OS updated|Your release needs you to finish an update)"),
      }
      ROUTE_DEFAULTS = {"notifications": "chats", **{"system:" + k: "daily" for k in SYSTEM_KINDS}}
      ROUTES_MAX = 300
      ROUTE_HOOKS = []   # fn(changes) after a saved change (the phone router takes an app's notifications away)
      # What a source is called (the Morning Report's Overnight lines use these, so its picker knows which line is which).
      ROUTE_NAMES = {"notifications": "Notifications", **{"system:" + k: v[0] for k, v in SYSTEM_KINDS.items()}}


      # Morning Report sections (format wizard.report-section/1): "report:<section id>", e.g. report:wizard-health or
      # report:wizard-calendar.today. A section lives in the Morning report (default) or is Off; Chats and Badge are refused
      # until an app can send its section on its own, so a section is never lost between places.
      REPORT_TO = ("daily", "off")
      REPORT_ROUTES = {"prefix": "report:", "default": "daily", "allowed": list(REPORT_TO)}


      def _report_id(i):
          import re
          return isinstance(i, str) and bool(re.fullmatch(r"report:[a-z0-9][a-z0-9-]{0,47}(\.[a-z0-9][a-z0-9-]{0,31})?", i))


      def _route_id(i):
          if not isinstance(i, str):
              return False
          if i.startswith("system:"):
              return i[7:] in SYSTEM_KINDS
          if i.startswith("report:"):
              return _report_id(i)
          return _source_app(i)


      def _daily_ok(i):
          return i == "notifications" or i.startswith("system:") or _report_id(i)


      CHATS_ONLY = ("notifications",)
      CHATS_ONLY_MSG = "The agent's own notifications always wait in Chats"


      def _route_ok(k, v):
          if k in CHATS_ONLY:
              return v == "chats"
          if v not in ROUTE_TO or (v == "daily" and not _daily_ok(k)):
              return False
          return v in REPORT_TO if k.startswith("report:") else True


      def _clean_routes(d):
          out = {}
          if isinstance(d, dict):
              for k, v in d.items():
                  if _route_id(k) and _route_ok(k, v):
                      out[k] = v
                  if len(out) >= ROUTES_MAX:
                      break
          return out


      def inbox_routes():
          try:
              with open(ROUTES_FILE) as f:
                  d = json.load(f)
          except (OSError, ValueError):
              d = {}
          raw = d.get("routes") if isinstance(d, dict) else None
          saved = _clean_routes(raw)
          for k in CHATS_ONLY:   # an old saved Badge/Daily/Off for them reads as Chats
              if isinstance(raw, dict) and k in raw:
                  saved[k] = "chats"
          return {"routes": saved, "defaults": dict(ROUTE_DEFAULTS), "names": ROUTE_NAMES, "report": REPORT_ROUTES,
                  "saved": bool(saved) or bool(isinstance(d, dict) and d.get("saved"))}


      def set_inbox_routes(changes):
          """changes: {source id: chats|badge|daily|off}. Unknown ids, values or a Daily an app can't take are refused."""
          if not isinstance(changes, dict) or not changes:
              raise ValueError("give routes as {source: chats|badge|daily|off}")
          for k, v in changes.items():
              if not _route_id(k):
                  raise ValueError("unknown source: %s" % str(k)[:70])
              if v not in ROUTE_TO:
                  raise ValueError("route must be chats, badge, daily or off")
              if k in CHATS_ONLY and v != "chats":
                  raise ValueError(CHATS_ONLY_MSG)
              if v == "daily" and not _daily_ok(k):
                  raise ValueError("%s can't wait for the morning report" % k)
              if k.startswith("report:") and v not in REPORT_TO:
                  raise ValueError("a report section is in the Morning report or Off")
          with _lock:
              cur = inbox_routes()["routes"]
              cur.update(changes)
              if len(cur) > ROUTES_MAX:
                  raise ValueError("too many sources")
              folder = os.path.dirname(ROUTES_FILE) or "."
              fd, tmp = tempfile.mkstemp(prefix=".routes-", suffix=".tmp", dir=folder)
              try:
                  with os.fdopen(fd, "w") as f:
                      json.dump({"routes": cur, "saved": True}, f)
                      f.flush()
                      os.fsync(f.fileno())
                  os.chmod(tmp, 0o666)
                  os.replace(tmp, ROUTES_FILE)
              except BaseException:
                  try:
                      os.unlink(tmp)
                  except OSError:
                      pass
                  raise
          for hook in ROUTE_HOOKS:
              try:
                  hook(changes)
              except Exception as e:   # the choice is saved; a hook never undoes it
                  print("route hook error: %s: %s" % (type(e).__name__, e), flush=True)
          return {"ok": True, "routes": cur, "defaults": dict(ROUTE_DEFAULTS), "saved": True}


      def system_kind(it):
          """Which System kind an item is: its sender's tags (wizard-system + kind), else its known title. None if not System."""
          import re
          tags = [str(t) for t in (it.get("tags") or [])]
          if "wizard-system" in tags:
              for k in SYSTEM_KINDS:
                  if k in tags:
                      return k
          title = str(it.get("title") or "").strip()
          for k, (_, rx) in SYSTEM_KINDS.items():
              if re.fullmatch(rx, title, re.I):
                  return k
          return None


      def needs_you(it):
          import re
          return "needs-you" in (it.get("tags") or []) or int(it.get("priority") or 3) >= 4 or \
              bool(re.search(r"need(s)? (a look|your OK|you)", str(it.get("title") or ""), re.I))


      def item_route_id(it):
          app = item_app(it.get("tags"))
          if app and not needs_you(it):
              return app
          k = system_kind(it)
          return "system:" + k if k and not needs_you(it) else "notifications"


      def daily_items(hours=24, now=None):
          """What waits for the Morning Report: items of the last `hours` whose source is set to Daily, grouped by source.
          Something that needs the owner is never here (it follows Notifications' own choice)."""
          now = now or time.time()
          try:
              hours = max(1, min(int(hours), 72))
          except (TypeError, ValueError):
              hours = 24
          r = inbox_routes()
          routes = {**r["defaults"], **r["routes"]}
          groups = {}
          for it in inbox_items("all", 500)["items"]:
              if now - float(it.get("time") or 0) > hours * 3600:
                  continue
              rid = item_route_id(it)
              if routes.get(rid) != "daily":
                  continue
              g = groups.setdefault(rid, {"source": rid, "name": SYSTEM_KINDS[rid[7:]][0] if rid.startswith("system:") else "Notifications", "items": []})
              g["items"].append({"id": it["id"], "time": it["time"], "title": it["title"], "message": it["message"][:500]})
          return {"hours": hours, "groups": list(groups.values())}


      @tool("notifications_inbox", "Read the owner's notification inbox (agent notes and scheduled-job results) with what they "
            "have read, flagged or archived. Use it to answer 'what came in', 'what failed overnight' or 'what did I flag'.",
            {"view": {"type": "string", "enum": ["inbox", "flagged", "archive", "all"], "description": "default inbox"},
             "unread_only": {"type": "boolean", "description": "only unread items"},
             "limit": {"type": "integer", "description": "max items, default 30"}})
      def notifications_inbox(view="inbox", unread_only=False, limit=30):
          _box_only()
          d = inbox_items(view, 500)
          items = [i for i in d["items"] if not (unread_only and i["read"])][:max(1, min(int(limit or 30), 200))]
          for i in items:
              i["time"] = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(i["time"]))
              i["message"] = i["message"][:600]
          return {"counts": d["counts"], "items": items}


      @tool("notifications_mark", "Mark inbox items read, unread, flagged or archived for the owner, when they ask.",
            {"ids": {"type": "array", "items": {"type": "string"}, "description": "item ids from notifications_inbox"},
             "read": {"type": "boolean"}, "flag": {"type": "boolean"}, "archived": {"type": "boolean"}},
            ["ids"])
      def notifications_mark(ids, read=None, flag=None, archived=None):
          _box_only()
          return inbox_mark(ids, read=read, flag=flag, archived=archived)


      def _json(code, obj):
          return code, "application/json", json.dumps(obj).encode()


      # ---- Notification pictures: MEDIA:/abs/path lines in a body show as thumbnails ----
      # Read-only, image files only, under an explicit allowlist of roots (mounted read-only at the same paths).
      # Every path is resolved with realpath first, so ../ and symlinks that leave a root are refused.
      MEDIA_ROOTS = [os.path.realpath(r) for r in os.environ.get("INBOX_MEDIA_ROOTS", "").split(":") if r.strip().startswith("/")]
      MEDIA_MAX = int(os.environ.get("INBOX_MEDIA_MAX", str(8 << 20)))
      MEDIA_TYPES = {".jpg": "image/jpeg", ".jpeg": "image/jpeg", ".png": "image/png", ".gif": "image/gif", ".webp": "image/webp"}


      def _sniff(head):
          if head[:3] == b"\xff\xd8\xff":
              return "image/jpeg"
          if head[:8] == b"\x89PNG\r\n\x1a\n":
              return "image/png"
          if head[:6] in (b"GIF87a", b"GIF89a"):
              return "image/gif"
          if head[:4] == b"RIFF" and head[8:12] == b"WEBP":
              return "image/webp"
          return ""


      def media_file(raw):
          """(status, content_type, bytes) for one allowed image; never a listing, never a non-image."""
          raw = str(raw or "")
          if not raw.startswith("/") or len(raw) > 1000 or "\x00" in raw:
              return _json(400, {"error": "bad path"})
          real = os.path.realpath(raw)
          if not any(real.startswith(root.rstrip("/") + "/") for root in MEDIA_ROOTS):
              return _json(404, {"error": "not found"})
          want = MEDIA_TYPES.get(os.path.splitext(real)[1].lower())
          if not want:
              return _json(404, {"error": "not found"})
          try:
              fd = os.open(real, os.O_RDONLY | getattr(os, "O_NOFOLLOW", 0))
          except OSError:
              return _json(404, {"error": "not found"})
          try:
              st = os.fstat(fd)
              if (st.st_mode & 0o170000) != 0o100000:  # regular files only
                  return _json(404, {"error": "not found"})
              if st.st_size > MEDIA_MAX:
                  return _json(413, {"error": "image too large"})
              with os.fdopen(fd, "rb", closefd=False) as f:
                  data = f.read(MEDIA_MAX + 1)
          finally:
              os.close(fd)
          if len(data) > MEDIA_MAX:
              return _json(413, {"error": "image too large"})
          if _sniff(data[:16]) != want:
              return _json(415, {"error": "not an image"})
          return 200, want, data


      @route(INBOX)
      def inbox_route(method, path, query, headers, body):
          sub = path[len(INBOX):] if path.startswith(INBOX) else ""
          q = urllib.parse.parse_qs(query)
          if method == "GET" and sub in ("", "index.html"):
              html = MINIMAL_HTML if (q.get("layout") or [""])[0] == "minimal" else PAGE_HTML.replace('<script defer', '<script src="layout.js"></script><script defer')
              return 200, "text/html; charset=utf-8", html.encode()
          if method == "GET" and sub in MINIMAL_ASSETS:
              mime, content = MINIMAL_ASSETS[sub]
              return 200, mime + "; charset=utf-8", content.encode()
          if method == "GET" and sub == "inbox.js":
              return 200, "text/javascript; charset=utf-8", PAGE_JS.encode()
          if method == "GET" and sub == "inbox.css":
              return 200, "text/css; charset=utf-8", PAGE_CSS.encode()
          if method == "GET" and sub == "api/items":
              return _json(200, inbox_items((q.get("view") or ["inbox"])[0], (q.get("limit") or [200])[0]))
          if method == "GET" and sub == "api/count":
              return _json(200, inbox_items("inbox", 1)["counts"])
          if method == "POST" and sub == "api/mark":
              # JSON only: a form on another site cannot send this without a CORS preflight, which is never granted.
              if not headers.get("content-type", "").startswith("application/json"):
                  return _json(415, {"error": "send application/json"})
              d = json.loads(body or b"{}")
              return _json(200, inbox_mark(d.get("ids"), at=d.get("at"), read=d.get("read"), flag=d.get("flag"), archived=d.get("archived")))
          if method == "GET" and sub == "api/marks":
              return _json(200, app_marks())
          if method == "GET" and sub == "api/sources":
              return _json(200, inbox_sources())
          if method == "POST" and sub == "api/sources":
              # JSON only and small: { "app": "<id>", "chats": true|false, "phone": true|false }.
              if not headers.get("content-type", "").startswith("application/json"):
                  return _json(415, {"error": "send application/json"})
              if len(body or b"") > SOURCES_MAX_BODY:
                  return _json(413, {"error": "request too large"})
              try:
                  d = json.loads(body or b"{}")
              except ValueError:
                  return _json(400, {"error": "bad json"})
              if not isinstance(d, dict):
                  return _json(400, {"error": "send an object"})
              try:
                  return _json(200, set_inbox_source(d.get("app"), chats=d.get("chats"), phone=d.get("phone")))
              except ValueError as e:
                  return _json(400, {"error": str(e)})
          if method == "GET" and sub == "api/routes":
              return _json(200, inbox_routes())
          if method == "POST" and sub == "api/routes":
              # JSON only and small: { "routes": { "<source>": "chats"|"badge"|"daily"|"off" } }.
              if not headers.get("content-type", "").startswith("application/json"):
                  return _json(415, {"error": "send application/json"})
              if len(body or b"") > SOURCES_MAX_BODY * 4:
                  return _json(413, {"error": "request too large"})
              try:
                  d = json.loads(body or b"{}")
              except ValueError:
                  return _json(400, {"error": "bad json"})
              try:
                  return _json(200, set_inbox_routes(d.get("routes") if isinstance(d, dict) else None))
              except ValueError as e:
                  return _json(400, {"error": str(e)})
          if method == "GET" and sub == "api/daily":
              return _json(200, daily_items((q.get("hours") or [24])[0]))
          if method == "GET" and sub.startswith("media/"):
              # /notifications/media/<absolute path>: the path keeps its image extension so the shell's viewer opens it.
              return media_file("/" + urllib.parse.unquote(sub[len("media/"):]))
          if method == "GET" and sub == "healthz":
              return _json(200, {"ok": True, "view_revision": MINIMAL_REVISION})
          return _json(404, {"error": "not found"})


